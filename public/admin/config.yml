# GENERATO da `pnpm cms:config` dagli schemi Zod (src/lib/schemas): non modificare a mano.
backend:
  name: github
  repo: gorlix/portfolio
  branch: main
publish_mode: simple
media_folder: public/cv
public_folder: /cv
site_url: https://alessandrogorla.it
i18n:
  structure: multiple_folders
  locales:
    - it
    - en
  default_locale: it
output:
  omit_empty_optional_fields: true
  yaml:
    quote: double
    indent_size: 2
collections:
  - name: pagine
    label: Pagine e testi
    i18n: true
    files:
      - name: profile
        label: Profile
        file: src/content/profile/{{locale}}.yml
        i18n: true
        fields:
          - name: name
            i18n: duplicate
            widget: string
          - name: role
            i18n: true
            widget: string
          - name: location
            i18n: true
            widget: string
          - name: availability
            i18n: true
            widget: string
          - name: tagline
            i18n: true
            widget: text
          - name: languages
            i18n: true
            widget: list
            min: 1
            fields:
              - name: name
                i18n: true
                widget: string
              - name: level
                i18n: true
                widget: string
          - name: email
            i18n: duplicate
            widget: string
            type: email
          - name: links
            i18n: duplicate
            widget: object
            fields:
              - name: github
                i18n: duplicate
                widget: string
                type: url
