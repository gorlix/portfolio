# Infrastruttura SIMULATA (spec §12.1, §11): nomi generici o inventati, nessun dato reale.
simulated: true
regions:
  - id: casa
    name: Casa
    kind: home
  - id: produzione
    name: Produzione
    kind: production
nodes:
  - id: nodo-1
    name: node-1
    region: casa
  - id: nodo-2
    name: node-2
    region: casa
  - id: nodo-3
    name: node-3
    region: produzione
services:
  - id: adguard-primario
    name: AdGuard Home (primario)
    node: nodo-1
  - id: adguard-backup
    name: AdGuard Home (backup)
    node: nodo-3
  - id: home-assistant
    name: Home Assistant
    node: nodo-2
  - id: frigate
    name: Frigate
    node: nodo-1
  - id: traefik-casa
    name: Traefik
    node: nodo-1
  - id: traefik-produzione
    name: Traefik
    node: nodo-3
  - id: tunnel-casa
    name: Cloudflare Tunnel
    node: nodo-1
  - id: tunnel-produzione
    name: Cloudflare Tunnel
    node: nodo-3
  - id: authentik
    name: Authentik (SSO)
    node: nodo-3
  - id: nextcloud
    name: Nextcloud
    node: nodo-3
  - id: monitoring
    name: Monitoraggio
    node: nodo-2
links:
  - from: casa
    to: produzione
    kind: overlay
  - from: adguard-primario
    to: adguard-backup
    kind: failover
adrs:
  - id: dns-failover
    title: DNS che non va in ferie
    summary: Due AdGuard Home dietro un IP virtuale gestito da Keepalived. Se il primario cade risponde il backup, e in casa nessuno se ne accorge.
    url: https://github.com/gorlix/homelab/blob/main/docs/adr/001-adguard-ha-failover.md
    nodes: [nodo-1, nodo-3]
  - id: tunnel
    title: Tunnel al posto delle porte aperte
    summary: I servizi escono su Internet tramite un tunnel in uscita, con Traefik davanti. Il router resta chiuso e io dormo meglio.
    url: https://github.com/gorlix/homelab/blob/main/docs/adr/002-cloudflare-tunnel.md
    nodes: [nodo-1, nodo-3]
  - id: multi-sito
    title: Due siti, una rete sola
    summary: Casa e Produzione sono collegate da una rete overlay cifrata. Ogni sito sa stare in piedi da solo, insieme fanno meno fatica.
    url: https://github.com/gorlix/homelab/blob/main/docs/adr/005-topologia-multi-sito.md
    nodes: [nodo-1, nodo-2, nodo-3]
  - id: segreti
    title: I segreti stanno fuori dal repository
    summary: Password e token arrivano da un gestore di segreti al momento del deploy. Nel repository c'è solo il nome di cosa serve, mai il valore.
    url: https://github.com/gorlix/homelab/blob/main/docs/adr/007-infisical-env-management.md
    nodes: [nodo-2, nodo-3]
  - id: compose
    title: Docker Compose sotto controllo di versione
    summary: Ogni servizio è un file Compose versionato; Renovate propone gli aggiornamenti e il deploy parte da solo. Niente modifiche a mano sul server.
    url: https://github.com/gorlix/homelab/blob/main/docs/adr/008-docker-compose-management.md
    nodes: [nodo-1, nodo-2, nodo-3]
  - id: persistenza
    title: I dati vivono fuori dai container
    summary: I volumi stanno separati dai container che li usano. Un container si butta e si ricrea, i dati restano dove sono.
    url: https://github.com/gorlix/homelab/blob/main/docs/adr/010-persistenza-dati-fuori-dalla-lxc.md
    nodes: [nodo-2]
backup:
  source: home-assistant
  targets:
    - id: object-storage
      name: Cloudflare R2
      medium: cloud
      offsite: true
    - id: cloud-drive
      name: Google Drive
      medium: cloud
      offsite: true
    - id: copia-locale
      name: Copia locale
      medium: local
      offsite: false
wip:
  - id: kubernetes-flux
    name: Kubernetes + Flux
    summary: Il passaggio da Compose a un cluster gestito in GitOps. Procede, con calma e molti caffè.
    region: casa
  - id: ci
    name: CI per l'infrastruttura
    summary: Controlli automatici su ogni modifica prima del deploy. Oggi alcuni li faccio ancora a occhio.
    region: produzione
simulation:
  seed: 20261027
  logs:
    - service: traefik-casa
      message: "GET /status 200 4ms"
    - service: traefik-produzione
      message: "GET /login 302 11ms"
    - service: adguard-primario
      message: "query A example.test cached 0ms"
    - service: adguard-backup
      message: "sync: config up to date"
    - service: home-assistant
      message: "automation triggered: evening lights"
    - service: frigate
      message: "camera-1: motion detected, clip saved"
    - service: authentik
      message: "login ok, session refreshed"
    - service: nextcloud
      message: "cron: background jobs done in 2.1s"
    - service: monitoring
      message: "scrape ok: 3 targets, 0 down"
    - service: tunnel-casa
      message: "tunnel healthy, 4 connections"
    - service: tunnel-produzione
      message: "tunnel healthy, 4 connections"
  failover:
    down:
      - service: adguard-primario
        message: "keepalived: health check failed, VRRP MASTER -> FAULT"
      - service: adguard-backup
        message: "keepalived: VRRP BACKUP -> MASTER, VIP acquired"
    up:
      - service: adguard-primario
        message: "keepalived: health check ok, VRRP FAULT -> MASTER"
      - service: adguard-backup
        message: "keepalived: VRRP MASTER -> BACKUP, VIP released"
