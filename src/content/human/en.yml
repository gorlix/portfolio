trimind:
  titleSuffix: "Trimind, in depth"
  metaDescription: "My work for Trimind in five moments: infrastructure, backups, CI/CD, observability and multi-provider, quality."
  eyebrow: "Deep dive"
  intro: "Here is what sits under the hood, one piece at a time. Scroll and the map comes apart."
  back: "← back to work"
  scrollHint: "Scroll for the first piece."
  posterSubject: "of the Trimind map"
  simulatedNote: "Charts and values on the panels are simulated data, not the real metrics."
  step: "{n} of {total}"
  moments:
    - id: infra
      title: "Infrastructure"
      lead: "House rule: nobody walks in from the internet. The tunnel is the only way in."
      results: [0]
    - id: backup
      title: "Backups and compliance"
      lead: "Data stays as long as it is needed, then it goes. The GDPR asks for that too."
      results: [1]
    - id: cicd
      title: "CI/CD"
      lead: "Four repositories, a runner of my own and two-colour releases."
      results: [2]
    - id: observability
      title: "Observability and multi-provider"
      lead: "If something breaks I want to be the first to know. And I want to know which LLM answers best, and at what price."
      results: [3, 4]
    - id: quality
      title: "Quality"
      lead: "Scores are computed by code, the same way every time. The tests are there to remind it."
      results: [5, 6]
      stack: true
