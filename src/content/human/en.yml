home:
  greeting: Hi, I'm Alessandro. I tinker, I break things, and then I put them back together better than before. The rest is below.
  scrollHint: Scroll, or jump straight to any stop from the menu.
  avatarLabel: Low-poly avatar coming soon
  badgesLabel: "Technical skills: pick one to see where I use it"
intros:
  home: Welcome to the human path.
  lavori: Where I have worked and what I got up to, in order of appearance.
  homelab: Three nodes, two sites and a constant urge to "optimise just a bit more". What you see here is an invented version, not the real infrastructure.
  domotica: A house that switches things on by itself, more or less when I want it to. Home Assistant is my playmate.
  certificazioni: Pieces of paper proving I really did study something.
  sport: When I am not in front of a screen, I am usually on the move.
  interessi: The messier side of me, which is also the more fun one.
  beneficenza: Some of my time goes to other people, with fewer jokes.
  contatti: If you made it this far, write to me. I do reply, promise.
