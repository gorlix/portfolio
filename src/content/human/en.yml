scenes:
  homelab: "Two low-poly platforms, Home and Production, with the homelab nodes and a beam of light joining them"
  domotica: "Low-poly house seen from above, with rooms lighting up when an automation runs"
  beneficenza: "A network of dots that slowly move closer and link up around a centre"
  contatti: "A small terminal that switches on, with prompt lines appearing one after another"
  scrivania: "My low-poly desk: a monitor with a terminal, a split keyboard, a 3D printer and a mini server with blinking LEDs"
  interessi: "A long low-poly workbench with six giant objects in a row (3D printer, split keyboard, e-ink tablet, notes with an obsidian rock, gears, a plate under a cloche) and a small penguin walking past them"
  lavori: "A low-poly tree: the trunk is the timeline and the jobs sprout from it, one leaf to the right and one to the left"
  trimind: "The low-poly map of Trimind: a closed server with its containers and a single tunnel to the cloud, expiring backups, the pipeline, monitoring panels and tests turning green"
  opensource: "A low-poly city with one district for each group of repositories and a penguin walking through it, taller where there are more stars"
  certificazioni: "A low-poly notice board with hexagonal slots, two hexagons half full of liquid and a row of small badges, with a penguin reading in front of it"
  sport: "A big snowy low-poly mountain inspired by Mont Blanc: a ski run in the middle with a penguin carving down, a trail on the left with two penguins climbing, a tennis court and a volleyball court on the right"
