intros:
  home: Benvenuto nel percorso umano.
  lavori: Dove ho lavorato e cosa ho combinato, dall'ultimo in giù.
  homelab: Tre nodi, due siti e la tentazione costante di "ottimizzare ancora un po'". Quello che vedi qui è una versione inventata, non l'infrastruttura vera.
  domotica: Una casa che si accende da sola, più o meno quando voglio io. Home Assistant è il mio compagno di giochi.
  certificazioni: Pezzi di carta che dimostrano che qualcosa l'ho studiato davvero.
  sport: Quando non sono davanti a uno schermo, di solito sono in movimento.
  interessi: Il lato meno ordinato di me, che poi è quello più divertente.
  beneficenza: Una parte di tempo che dedico agli altri, senza troppe battute.
  contatti: Se sei arrivato fin qui, scrivimi. Rispondo, giuro.
