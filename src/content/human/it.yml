homeTitle: Inizio
home:
  greeting: Ciao, sono Alessandro. Smanetto, rompo cose e poi le rimetto insieme meglio di prima. Qui trovi il resto.
  scrollHint: Scorri, oppure salta direttamente a una tappa dal menu.
  badgesLabel: "Competenze tecniche: scegline una per vedere dove la uso"
  posterSubject: della scrivania
  hardwareTitle: Cosa c'è sulla scrivania
  hardwareLabel: "Hardware sulla scrivania: scegline uno per saperne di più"
  hardwareHint: Passa il mouse sugli oggetti della scrivania, toccali oppure scegli dall'elenco.
  hardware:
    - id: printer
      name: Stampante 3D
      text: Stampa pezzi che poi progetto male e ristampo meglio. I miei modelli stanno su Printables.
      url: https://www.printables.com/@Gorlix_50644
      linkLabel: Il mio profilo Printables
    - id: trackball
      name: Trackball Ploopy Adept
      text: Gialla, con la sfera nera. Il firmware QMK è mio, perché il mouse normale non mi bastava.
      url: https://github.com/gorlix/my-adept
      linkLabel: Il firmware su GitHub
    - id: moonlander
      name: Tastiera ZSA Moonlander
      text: Tastiera split con più layer di quanti ne ricordi. Il layout è il mio, su Oryx.
      url: https://configure.zsa.io/moonlander/layouts/0olR6/latest/0
      linkLabel: Il mio layout su Oryx
    - id: monitor
      name: Monitor
      text: Il terminale resta aperto più a lungo di quanto dovrebbe.
    - id: server
      name: Mini-server sulla mensola
      text: Piccolo, silenzioso e con più lucine del necessario.
    - id: window
      name: Finestra
      text: Il mio unico contatto con il mondo esterno durante i deploy.
