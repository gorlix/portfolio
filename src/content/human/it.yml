scenes:
  homelab: "Due piattaforme low-poly, Casa e Produzione, con i nodi dell'homelab e un fascio di luce che le collega"
  domotica: "Casa low-poly vista dall'alto, con le stanze che si illuminano quando parte un'automazione"
  beneficenza: "Una rete di punti che si avvicinano piano e si collegano al centro"
  contatti: "Un piccolo terminale che si accende, con le righe di prompt che compaiono una dopo l'altra"
  scrivania: "La mia scrivania low-poly: monitor col terminale, tastiera split, stampante 3D e mini-server con le spie che lampeggiano"
  interessi: "Un lungo banco da lavoro low-poly con sei oggetti giganti in fila (stampante 3D, tastiera split, tablet e-ink, appunti con una roccia di ossidiana, ingranaggi, piatto con la cupola) e un piccolo pinguino che ci cammina davanti"
  lavori: "Un albero low-poly: il tronco è la linea del tempo e da lì spuntano le esperienze, una foglia a destra e una a sinistra"
  trimind: "La mappa low-poly di Trimind: un server chiuso con i suoi container e un solo tunnel verso la nuvola, i backup che scadono, la pipeline, i pannelli di monitoraggio e i test che diventano verdi"
  opensource: "Una città low-poly con un quartiere per ogni gruppo di repository e un pinguino che la attraversa, più alta dove ci sono più stelle"
  certificazioni: "Una parete-bacheca low-poly con slot esagonali, due esagoni mezzi pieni di liquido e una fila di badge piccoli, con un pinguino che legge davanti"
  sport: "Una grande montagna low-poly innevata, ispirata al Monte Bianco: al centro una pista da sci con un pinguino che scende a curve, a sinistra un sentiero con due pinguini che salgono, a destra un campo da tennis e uno da pallavolo"
